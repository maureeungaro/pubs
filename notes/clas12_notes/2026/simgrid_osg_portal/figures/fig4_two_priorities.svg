<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box    { fill:#ffffff; stroke:#333333; stroke-width:1.5; }
    .pend   { fill:#eaf1f8; stroke:#1a5fb4; stroke-width:1.8; }
    .runp   { fill:#f4ece4; stroke:#a5451f; stroke-width:1.8; }
    .store  { fill:#f2f2f2; stroke:#666666; stroke-width:1.5; }
    .hdr    { font-size:15px; font-weight:bold; }
    .fn     { font-size:12.5px; font-weight:bold; fill:#111111; font-family:Menlo, monospace; }
    .t      { font-size:11.5px; fill:#333333; }
    .eb     { stroke:#1a5fb4; stroke-width:2; fill:none; marker-end:url(#ab); }
    .er     { stroke:#a5451f; stroke-width:2; fill:none; marker-end:url(#ar); }
    .shared { stroke:#888888; stroke-width:1.6; fill:none; stroke-dasharray:5 4; marker-end:url(#ag); }
    .cap    { font-size:11px; fill:#555555; }
  </style>
  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1a5fb4"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#a5451f"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#888888"/></marker>
  </defs>

  <text x="30" y="34" class="hdr" fill="#111111">Two independent priority systems — one shared HTCondor owner (gemc)</text>

  <!-- LEFT: pending queue -->
  <rect x="30" y="60" width="500" height="230" rx="10" fill="#f8fbff" stroke="#1a5fb4" stroke-width="1.2"/>
  <text x="50" y="86" class="hdr" fill="#1a5fb4">10 · Pending-submission priority</text>
  <text x="50" y="108" class="t">Orders requests BEFORE submission</text>

  <rect class="pend" x="50" y="122" width="270" height="58" rx="8"/>
  <text x="62" y="146" class="fn">priority_submissions.py</text>
  <text x="62" y="166" class="t">history-weighted, load-aware, aging_interleaved</text>

  <rect class="store" x="360" y="122" width="150" height="58" rx="8"/>
  <text x="435" y="147" text-anchor="middle" class="fn" font-size="11">MySQL</text>
  <text x="435" y="166" text-anchor="middle" class="t">submissions.priority</text>

  <line class="eb" x1="320" y1="151" x2="358" y2="151"/>

  <rect class="box" x="50" y="210" width="270" height="52" rx="8"/>
  <text x="62" y="232" class="fn">osg_submit.py</text>
  <text x="62" y="250" class="t">claims smallest positive priority (1 = next)</text>
  <line class="eb" x1="435" y1="180" x2="435" y2="212 " />
  <path class="eb" d="M435,180 C435,205 250,200 250,208"/>
  <text x="230" y="284" text-anchor="middle" class="cap">writes 1..N under advisory lock · reads priority 1</text>

  <!-- RIGHT: runtime -->
  <rect x="590" y="60" width="500" height="230" rx="10" fill="#fdf7f2" stroke="#a5451f" stroke-width="1.2"/>
  <text x="610" y="86" class="hdr" fill="#a5451f">11 · Running-job priority</text>
  <text x="610" y="108" class="t">Balances clusters AFTER submission</text>

  <rect class="runp" x="610" y="122" width="270" height="58" rx="8"/>
  <text x="622" y="146" class="fn">run_priority_map.py</text>
  <text x="622" y="166" class="t">20 oldest clusters → ratio → [-5, 5]</text>

  <rect class="store" x="920" y="122" width="150" height="58" rx="8"/>
  <text x="995" y="147" text-anchor="middle" class="fn" font-size="11">HTCondor</text>
  <text x="995" y="166" text-anchor="middle" class="t">JobPrio</text>

  <line class="er" x1="880" y1="151" x2="918" y2="151"/>

  <rect class="box" x="610" y="210" width="270" height="52" rx="8"/>
  <text x="622" y="232" class="fn">HTCondor scheduler</text>
  <text x="622" y="250" class="t">larger JobPrio runs first</text>
  <path class="er" d="M995,180 C995,205 810,200 810,208"/>
  <text x="790" y="284" text-anchor="middle" class="cap">writes JobPrio to 20 oldest clusters · scheduler consumes</text>

  <!-- shared input -->
  <rect class="box" x="410" y="360" width="300" height="56" rx="8"/>
  <text x="560" y="384" text-anchor="middle" class="fn" font-size="11.5">condor_io/htcondor_utils.py</text>
  <text x="560" y="402" text-anchor="middle" class="t">live running-job counts per cluster / user</text>

  <path class="shared" d="M300,262 C300,388 408,388 408,388"/>
  <path class="shared" d="M712,388 C820,388 810,262 810,262"/>
  <text x="560" y="440" text-anchor="middle" class="cap" font-weight="bold" fill="#888888">shared INPUT (live occupancy) — but separate outputs, separate stores, separate goals</text>

  <!-- separation bar -->
  <line x1="560" y1="60" x2="560" y2="300" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="3 4"/>

  <text x="30" y="490" class="cap" font-weight="bold" fill="#111111">Scope boundary: system 10 writes ONLY submissions.priority; system 11 writes ONLY JobPrio. Neither value is inferred from the other.</text>
</svg>
